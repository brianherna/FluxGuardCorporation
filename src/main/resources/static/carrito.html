<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluxGuard — Tu carrito</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="plans-page shop-page">

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <a href="index.html#inicio" class="navbar-logo" aria-label="FluxGuard - Inicio">
      <img src="assets/fluxguard-logo-full.png" class="navbar-logo-image" alt="FluxGuard">
    </a>

    <nav class="navbar-links" id="navbarMenu">
      <a href="index.html#inicio">Inicio</a>
      <a href="planes.html">Planes</a>
      <a href="tienda.html">Tienda</a>
      <a href="contacto.html">Contacto</a>
    </nav>

    <div class="navbar-actions" id="navbar-auth-action">
      <a href="login.html" class="navbar-panel">
        Iniciar sesión <i class="bi bi-arrow-up-right"></i>
      </a>
    </div>

    <button type="button" class="navbar-mobile-toggle" id="navbarToggle" aria-label="Abrir menú">
      <i class="bi bi-list fs-4"></i>
    </button>
  </header>

  <div class="plans-background"></div>
  <div class="plans-grid-noise"></div>

  <main class="checkout-shell">
    <span class="section-eyebrow"><span></span> FLUXGUARD / CONFIRMAR COMPRA</span>
    <h1>Tu<br><em>carrito.</em></h1>

    <div id="checkout-alert" class="d-none"></div>
    <div class="checkout-box" id="checkout-box">
      <div class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span> Cargando tu carrito...</div>
    </div>

    <!-- Acceso a políticas: cada tarjeta abre la sobrepantalla en su pestaña -->
    <section class="checkout-policies" aria-labelledby="politicas-titulo">
      <span class="section-eyebrow" id="politicas-titulo"><span></span> ANTES DE COMPRAR</span>
      <div class="checkout-policies-grid">
        <button type="button" class="policy-card" data-sobrepantalla="politicas" data-seccion="compra">
          <i class="bi bi-bag-check"></i>
          <strong>Políticas de compra</strong>
          <span>Precios, pagos, folios y factura.</span>
        </button>
        <button type="button" class="policy-card" data-sobrepantalla="politicas" data-seccion="envio">
          <i class="bi bi-truck"></i>
          <strong>Envío</strong>
          <span>Cobertura, costo y tiempos de entrega.</span>
        </button>
        <button type="button" class="policy-card" data-sobrepantalla="politicas" data-seccion="devoluciones">
          <i class="bi bi-arrow-counterclockwise"></i>
          <strong>Devoluciones y garantía</strong>
          <span>Cancelación, cambios y reembolsos.</span>
        </button>
      </div>
      <p class="checkout-policies-note">Al pagar aceptas nuestras políticas. Consulta también el <a href="#" data-sobrepantalla="privacidad">Aviso de Privacidad</a>.</p>
    </section>
  </main>

  <footer class="plans-footer">
    <span>FLUXGUARD / MONITOREA HOY, PROTEGE MAÑANA</span>
    <a href="tienda.html">SEGUIR COMPRANDO <i class="bi bi-arrow-up-right"></i></a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", initCheckoutCarrito);
    // Si el carrito cambia desde el panel lateral, se vuelve a dibujar el resumen
    document.addEventListener("carrito:actualizado", event => renderResumen(event.detail));

    // Métodos de pago que el servidor tiene configurados ("paypal", "stripe")
    let metodosPago = ["paypal"];
    // Casilla de aceptación de políticas: se conserva aunque el resumen se vuelva a dibujar
    let politicasAceptadas = false;

    async function initCheckoutCarrito() {
      // No hace falta iniciar sesión: sin sesión se paga como invitado
      if (localStorage.getItem("fluxg_token")) await obtenerUsuarioSesion();
      try {
        const res = await fetch(`${API_BASE}/api/pagos/metodos`);
        const data = await res.json();
        if (res.ok && Array.isArray(data.metodosPago)) metodosPago = data.metodosPago;
      } catch (_) {}

      // Regreso desde PayPal o Stripe: carrito.html?pedido=FOLIO&token=REFERENCIA (pagado) o &cancelado=1
      const params = new URLSearchParams(window.location.search);
      const folio = params.get("pedido");
      if (folio) {
        // Se limpia la URL para que recargar la página no repita la confirmación
        history.replaceState(null, "", "carrito.html");
        await procesarRegreso(folio, params.get("token"), params.get("cancelado") === "1");
        return;
      }

      try {
        renderResumen(await cargarCarrito());
      } catch (error) {
        document.getElementById("checkout-box").innerHTML = `<p class="m-0">${escapeHtml(error.message)}</p>`;
      }
    }

    async function procesarRegreso(folio, token, cancelado) {
      const alertBox = document.getElementById("checkout-alert");
      const box = document.getElementById("checkout-box");
      box.innerHTML = `<div class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span> ${cancelado ? "Cancelando..." : "Confirmando tu pago..."}</div>`;

      const ruta = cancelado ? `/api/pedidos/${encodeURIComponent(folio)}/cancelar`
        : token ? `/api/pedidos/${encodeURIComponent(folio)}/confirmar?token=${encodeURIComponent(token)}`
        : null;
      let data = null;
      try {
        const response = ruta
          ? await apiFetch(ruta, { method: "POST" })
          : await apiFetch(`/api/pedidos/${encodeURIComponent(folio)}`);
        data = await response.json().catch(() => null);
        if (!response.ok || !data?.success) throw new Error(data?.message || "No se pudo consultar tu pedido.");
      } catch (error) {
        showAlert(alertBox, "danger", escapeHtml(error.message));
        renderResumen(await cargarCarrito().catch(() => null));
        return;
      }

      const pedido = data.pedido;
      if (data.usuario) actualizarUsuario(data.usuario);
      if (pedido.estado === "PAGADO") {
        renderPanelCarrito({ lineas: [], total: 0, cantidadArticulos: 0 });
        mostrarExito(pedido, data.usuario);
        return;
      }

      if (pedido.estado === "PENDIENTE" && pedido.pagoId) {
        showAlert(alertBox, "info", `Tu pago del pedido <strong>${escapeHtml(pedido.folio)}</strong> está en revisión. Lo activaremos en cuanto se confirme.`);
      } else if (pedido.estado === "PENDIENTE") {
        showAlert(alertBox, "info", `Aún no recibimos la confirmación del pago de tu pedido <strong>${escapeHtml(pedido.folio)}</strong>. Si ya pagaste, recarga en un momento.`);
      } else if (pedido.estado === "CANCELADO") {
        showAlert(alertBox, "info", "Cancelaste el pago. Tu carrito sigue aquí por si quieres intentarlo de nuevo.");
      } else {
        showAlert(alertBox, "danger", "No se pudo completar el pago. No se hizo ningún cargo; puedes intentarlo de nuevo.");
      }
      renderResumen(await cargarCarrito().catch(() => null));
    }

    function renderResumen(carrito) {
      const box = document.getElementById("checkout-box");
      const alertBox = document.getElementById("checkout-alert");
      if (!carrito || carrito.lineas.length === 0) {
        box.innerHTML = `
          <div class="cart-empty py-4">
            <i class="bi bi-cart3"></i>
            <p>Tu carrito está vacío.</p>
            <a href="tienda.html" class="plan-button d-inline-flex">IR A LA TIENDA <i class="bi bi-arrow-up-right ms-2"></i></a>
          </div>`;
        return;
      }

      const gratis = carrito.total === 0;
      const botones = gratis
        ? `<button type="button" class="plan-button cart-checkout w-100" data-metodo="paypal">CONFIRMAR PEDIDO <i class="bi bi-arrow-up-right"></i></button>`
        : [
            metodosPago.includes("stripe") ? `<button type="button" class="plan-button cart-checkout w-100 mb-2" data-metodo="stripe">PAGAR CON TARJETA <i class="bi bi-credit-card"></i></button>` : "",
            metodosPago.includes("paypal") ? `<button type="button" class="plan-button w-100" data-metodo="paypal">PAGAR CON PAYPAL <i class="bi bi-paypal"></i></button>` : ""
          ].join("");
      box.innerHTML = `
        <div class="cart-lines">${lineasCarritoHtml(carrito)}</div>
        <div class="cart-total"><span>TOTAL · IVA INCLUIDO</span><strong>${dinero(carrito.total)}</strong></div>
        <div class="privacy-consent checkout-consent">
          <input type="checkbox" id="acepta-politicas"${politicasAceptadas ? " checked" : ""}>
          <label for="acepta-politicas">
            He leído y acepto las
            <a href="#" data-sobrepantalla="politicas" data-seccion="compra">políticas de compra</a>,
            <a href="#" data-sobrepantalla="politicas" data-seccion="envio">envío</a> y
            <a href="#" data-sobrepantalla="politicas" data-seccion="devoluciones">devoluciones</a>.
          </label>
        </div>
        ${botones || `<p class="m-0">Los pagos no están disponibles en este momento.</p>`}
        ${gratis ? "" : `
        <p class="checkout-note">
          <i class="bi bi-info-circle me-1"></i> Modo de prueba: no se cobra dinero real.
          ${metodosPago.includes("stripe") ? `Con tarjeta usa <strong>4242 4242 4242 4242</strong>, cualquier fecha futura y cualquier CVC.` : ""}
          ${metodosPago.includes("paypal") ? `Con PayPal inicia sesión con una <strong>cuenta compradora de prueba</strong>.` : ""}
          Al pagar regresarás aquí y tu pedido se confirmará.
        </p>`}`;
      if (carrito.avisos?.length) showAlert(alertBox, "info", carrito.avisos.map(escapeHtml).join("<br>"));
      conectarLineasCarrito(box, carrito, alertBox);
      box.querySelectorAll("button[data-metodo]").forEach(b => b.addEventListener("click", iniciarPago));

      // Los botones de pago se habilitan solo con la casilla de políticas marcada
      box.querySelector("#acepta-politicas").addEventListener("change", event => {
        politicasAceptadas = event.target.checked;
        if (politicasAceptadas) alertBox.classList.add("d-none");
        actualizarBotonesPago();
      });
      actualizarBotonesPago();
    }

    function actualizarBotonesPago() {
      document.querySelectorAll("button[data-metodo]").forEach(b => {
        b.disabled = !politicasAceptadas;
        b.title = politicasAceptadas ? "" : "Marca la casilla de políticas para continuar";
      });
    }

    async function iniciarPago(event) {
      const boton = event.currentTarget;
      const metodo = boton.dataset.metodo;
      const textoOriginal = boton.innerHTML;
      const alertBox = document.getElementById("checkout-alert");
      if (!politicasAceptadas) {
        return showAlert(alertBox, "danger", "Debes aceptar las políticas de compra, envío y devoluciones para continuar.");
      }
      document.querySelectorAll("button[data-metodo]").forEach(b => b.disabled = true);
      boton.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> CONECTANDO CON ${metodo === "stripe" ? "STRIPE" : "PAYPAL"}...`;
      try {
        const response = await apiFetch(`/api/carrito/comprar?metodo=${encodeURIComponent(metodo)}`, { method: "POST" });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data?.success) {
          // El servidor pudo ajustar el carrito: se vuelve a cargar antes de mostrar el error
          renderResumen(await cargarCarrito().catch(() => null));
          throw new Error(data?.message || "No se pudo iniciar el pago.");
        }
        if (data.urlPago) {
          window.location.href = data.urlPago;
          return;
        }
        // Pedido de $0: se confirma sin pasar por la página de pago
        if (data.usuario) actualizarUsuario(data.usuario);
        renderPanelCarrito({ lineas: [], total: 0, cantidadArticulos: 0 });
        mostrarExito(data.pedido, data.usuario);
      } catch (error) {
        showAlert(alertBox, "danger", escapeHtml(error.message));
        actualizarBotonesPago();
        boton.innerHTML = textoOriginal;
      }
    }

    function mostrarExito(pedido, usuario) {
      document.getElementById("checkout-alert").classList.add("d-none");
      const metodo = nombreMetodoPago(pedido.metodoPago);
      document.getElementById("checkout-box").innerHTML = `
        <div class="checkout-success">
          <i class="bi bi-check2-circle"></i>
          <h2>¡Pago confirmado!</h2>
          <p class="text-white-50 mb-2">Folio <strong class="text-white">${escapeHtml(pedido.folio)}</strong> · Total ${dinero(pedido.total)} · ${escapeHtml(metodo)}</p>
          ${pedido.correoCliente ? `<p class="text-white-50 mb-4">Te contactaremos en <strong class="text-white">${escapeHtml(pedido.correoCliente)}</strong> para el envío de tu pedido. Guarda tu folio.</p>` : `<div class="mb-4"></div>`}
          <div class="cart-lines text-start mb-4">${pedido.lineas.map(l => `
            <div class="cart-line" style="grid-template-columns:1fr auto">
              <div class="cart-line-info"><strong>${escapeHtml(l.nombre)}</strong><span>${l.cantidad} × ${dinero(l.precioUnitario)}</span></div>
              <b class="cart-line-total">${dinero(l.importe)}</b>
            </div>`).join("")}
          </div>
          ${usuario?.suscripcion ? `<a href="dashboard.html" class="plan-button cart-checkout">IR A MI DASHBOARD <i class="bi bi-arrow-up-right ms-2"></i></a>` : ""}
          <a href="tienda.html" class="plan-button">SEGUIR COMPRANDO <i class="bi bi-arrow-up-right ms-2"></i></a>
          <div id="resenas-post-compra" class="text-start"></div>
        </div>`;
      // Con sesión: calificar lo que compró. Sin sesión: carrusel de reseñas positivas.
      initResenasPostCompra(document.getElementById("resenas-post-compra"), pedido);
    }
  </script>
</body>
</html>
