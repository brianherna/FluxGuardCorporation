spring.application.name=FluxG

# Este archivo SÍ se sube a git: solo contiene referencias a variables de entorno, nunca valores secretos.
# Los valores reales van en .env (local) o en las variables de entorno del hosting (Render).

# MongoDB (inyectado desde .env local o variables de entorno)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fluxg}
spring.data.mongodb.database=${MONGODB_DATABASE:fluxg}
# Crea los índices declarados en los modelos (correo único, expiración de sesiones)
spring.data.mongodb.auto-index-creation=true

# Servidor
server.port=${SERVER_PORT:8080}

# Brevo (correo de verificación de cuenta)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:FluxGuard}

# URL pública de la app (se usa en el enlace del correo de verificación)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Orígenes permitidos para llamar a la API desde otro dominio (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_BASE_URL:http://localhost:8080},http://localhost:8080,http://127.0.0.1:8080}

# Clave para consultar los prospectos (GET /api/prospectos con el encabezado X-Admin-Key). Vacía = consulta deshabilitada.
app.admin-api-key=${ADMIN_API_KEY:}

# PayPal. Las llaves van en .env / variables de entorno, nunca aquí. PAYPAL_MODE=sandbox = pagos de prueba.
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.currency=${PAYPAL_CURRENCY:MXN}

# Resend (alternativa a Brevo). Si RESEND_API_KEY tiene valor, los correos se envían con Resend; si está vacía, con Brevo.
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:${BREVO_SENDER_EMAIL:}}
